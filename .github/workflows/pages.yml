name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Rama o tag para compilar (por ejemplo: main o feature/docs)'
        required: true
        default: 'main'
      run_mode:
        description: 'build-only solo compila; deploy publica Pages (solo permitido con main)'
        required: true
        type: choice
        options:
          - build-only
          - deploy
        default: build-only

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare pinned docs environment
        run: |
          chmod +x sigre_setup_docs_env.sh
          ./sigre_setup_docs_env.sh

      - name: Build MkDocs site
        run: ./.venv-docs/bin/python -m mkdocs build

      - name: Build summary
        run: |
          echo "Workflow: ${{ github.workflow }}"
          echo "Evento: ${{ github.event_name }}"
          echo "Ref compilada: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.ref }}"
          echo "Modo: ${{ github.event_name == 'workflow_dispatch' && inputs.run_mode || 'deploy' }}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_mode == 'deploy' && inputs.target_ref == 'main') }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
